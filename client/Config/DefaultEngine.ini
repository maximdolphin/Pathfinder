; ---- the texture streaming pool, and why it is not set here ----------------
;
; It was raised to 6144 MB on 2026-09-09 on the theory that the ground looked
; soft because the streamer could not fit the library. The theory was good and
; the measurement killed it. From out/performance.txt on the scripted flight:
;
;     texture pool    6144 MB pool,   273 MB required  fits
;
; 273 MB. The engine default of 1000 MB was never close to short, and every
; surface was already being drawn from its top mip. The arithmetic that
; motivated the change -- 23 sets at 4K, three maps each, about 1.2 GB -- was
; right about the library and wrong about the working set: the terrain material
; binds three biome slots plus rock plus scree, five sets, and five sets is
; almost exactly the 273 MB measured. The other eighteen are never resident at
; once because nothing can ask for them at once.
;
; So the value is back to the engine's and the line that measured it stays in
; the performance report, which is the part actually worth keeping. If the
; multi-scale and stochastic sampling work in M2S raises the working set, the
; report will say so before anybody has to guess again.
;
; (Soft ground turned out to be geometry, not texels: a 4.77 m triangle floor
; and height maps that were sampled and thrown away. That is M2S.)

