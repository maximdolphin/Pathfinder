[/Script/Engine.RendererSettings]
; Auto exposure is what makes orbit-to-ground survivable: space is nearly black
; and a sunlit surface is not, and no single fixed exposure serves both. It was
; off here, which is part of why the first captures came back as flat cut-outs.
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.AutoExposure.Bias=-1.0
r.DefaultFeature.MotionBlur=False
; Volumetric clouds and sky need these on to look like anything.
r.SkyAtmosphere=1
r.VolumetricCloud=1
r.VolumetricFog=1
; Screen-space reflections: the effect that makes the sea read as water rather
; than as a blue plane. Opaque water writes depth, so SSR can see it.
r.SSR.Quality=3
r.SSR.MaxRoughness=0.3
r.GenerateMeshDistanceFields=False
; Cloud shadows on the ground and cloud ambient occlusion: most of what makes a
; deck read as volume rather than as a painted ceiling.
r.VolumetricCloud.ShadowMap=1
r.VolumetricCloud.SkyAO=1

