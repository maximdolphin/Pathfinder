[/Script/Engine.RendererSettings]
; Auto exposure is what makes orbit-to-ground survivable: space is nearly black
; and a sunlit surface is not, and no single fixed exposure serves both. It was
; off here, which is part of why the first captures came back as flat cut-outs.
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.AutoExposure.Bias=-1.0
r.DefaultFeature.MotionBlur=False
; Volumetric clouds and sky need these on to look like anything.
r.SkyAtmosphere=1
r.VolumetricCloud=1
r.VolumetricFog=1
; ---- Lumen -----------------------------------------------------------------
;
; Dynamic global illumination and reflections. The thing it buys, concretely:
; ground that is not lit by the sun is currently lit by nothing, so a hillside
; in its own shadow renders as pure black. Real ground in shadow is lit by the
; sky and by bounce off everything around it. That is the difference between a
; shadow and a hole.
;
; Hardware ray tracing rather than software. Lumen's software path traces
; against mesh distance fields, and distance fields are built offline for
; static meshes -- this planet's terrain is procedural mesh sections generated
; and streamed at runtime, so it has none and never will. Software Lumen would
; trace against an empty world and confidently return no bounce. Hardware
; tracing goes against the actual geometry, which is the only version of this
; that can see the ground.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.RayTracing=True
r.Lumen.HardwareRayTracing=1

; Screen-space reflections are superseded by Lumen reflections above and these
; are left only as the fallback path's settings. The sea reading as water
; rather than a blue plane is now Lumen's job.
r.SSR.Quality=3
r.SSR.MaxRoughness=0.3

; Still off, and now for a second reason: nothing here can build one. Every
; surface in the world is a procedural mesh generated at runtime, and mesh
; distance fields are an offline build product. Leaving this on would cost
; build time to produce nothing.
r.GenerateMeshDistanceFields=False
; Cloud shadows on the ground and cloud ambient occlusion: most of what makes a
; deck read as volume rather than as a painted ceiling.
r.VolumetricCloud.ShadowMap=1
r.VolumetricCloud.SkyAO=1

