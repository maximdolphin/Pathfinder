[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; Shader Model 6, and this is not a preference.
;
; Nanite and Lumen's hardware ray tracing both require SM6. Neither was
; configured, so both builds came up reporting "Using Highest Feature Level of
; D3D12: SM5" and raytracing=0 -- which means that when Lumen was enabled and
; when Nanite was switched on for the baked hull, the flags were set and the
; features were not running. Found by packaging, because a packaged build says
; its feature level plainly in the first hundred lines of its log and the editor
; had been saying the same thing for two days.
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

; ---- pipeline state objects -------------------------------------------------
;
; The first packaged build logged "Not using pipeline state disk cache per
; r.D3D12.PSO.DiskCache=0" and then twenty-two consecutive lines of
; "Encountered a new graphics PSO (PSOPrecacheState: Missed)" -- every one of
; which is a driver compiling a pipeline the first time something is drawn with
; it, which is a hitch at exactly the moment a new surface comes into view.
;
; Precaching builds them from the materials at load; the disk caches keep what
; the driver produced so the second run does not repeat the first run's work.

; Stable shader keys, which the cook only emits when asked. Without them the
; recorded PSO log cannot be turned into a shipped cache: the recording names
; shaders by a hash that changes every cook, and the .shk file is what maps
; those onto something durable. This is the input to
; `ShaderPipelineCacheTools Expand`; see docs/comparisons/packaged/pso/.
[DevOptions.Shaders]
NeedsShaderStableKeys=true

; These three lived under [/Script/WindowsTargetPlatform.WindowsTargetSettings]
; for two milestones, which is a UObject section: a stray r.* key there is not
; applied as a console variable, and none of them ever appeared in the log's
; "Set CVar" lines. Two of them happened to match the engine default, so the
; mistake cost nothing and showed nothing -- which is the worst kind.
;
; [SystemSettings] applies arbitrary CVars. It is not early enough for the
; D3D12 disk caches below, which the RHI reads while registering them, but PSO
; precaching is read long after config is up.
[SystemSettings]
; Anisotropic filtering, doubled from the engine's 8.
;
; Ground seen at a grazing angle is the whole game: standing on a planet, most
; of the screen is a surface running away from the camera at a few degrees,
; where one screen pixel covers a long thin footprint in the texture. That is
; exactly the case isotropic mip selection handles by blurring along the long
; axis, and the near ground in every eye-height capture was streaked because of
; it. 16 is the hardware maximum worth asking for.
;
; Checked rather than assumed to be the cause: the overhead capture from eight
; metres, where the same texels are seen face on, is crisp. Same texture, same
; material, same distance -- only the angle differs.
r.MaxAnisotropy=16
r.VT.MaxAnisotropy=16
r.PSOPrecaching=1
r.PSOPrecache.Resources=1
r.ShaderPipelineCache.Enabled=1

; Ray tracing geometry stays resident rather than being evicted when nothing in
; the scene references it (M5P, T440). The terrain's pooled patches are hidden
; between uses; past the 400 MB pool their geometry was evicted, and a patch
; shown again handed the renderer an evicted geometry -- "Dynamic ray tracing
; instance skipped because geometry 'ProceduralMeshComponent_3210' is evicted",
; an ensure (a hitch in itself), and a frame of Lumen tracing through ground that
; is there. The pool of patches is bounded, so resident is bounded too.
r.RayTracing.UseReferenceBasedResidency=0

; Garbage collection spread across frames rather than blocking one (T068).
;
; This project sets no GC configuration of its own, so it inherited the
; engine's default: a full blocking purge every 61.1 seconds. On the 200 km
; transect that is three purges, each 40-52 ms on the game thread, at 52, 107
; and 162 km -- three of the six frames over 33 ms that M02's gate forbids
; outright, and nowhere near the cold start.
;
; Established by changing the timer and watching them vanish, then fixed the
; way that helps a player rather than the fixture: raising the interval to
; 300 s also gave "a GC 0", but only by deferring collection past a 222-second
; window, and a deferred purge has more to collect when it lands. Incremental
; reachability keeps the purge on its own schedule and spreads the work.
;
; Measured twice, two independent pairs: blocking 3 GC frames both times,
; incremental 1 then 0. Judged on the named frames rather than the total,
; because the over-budget count carries a run-to-run spread of about ten.
gc.AllowIncrementalReachability=1
gc.IncrementalReachabilityTimeLimit=0.002
gc.AllowIncrementalGather=1
gc.IncrementalBeginDestroyEnabled=1

; The two D3D12 driver disk caches are NOT set here, and the reason is worth
; the paragraph.
;
; r.D3D12.PSO.DiskCache and r.D3D12.PSO.DriverOptimizedDiskCache were tried in
; [/Script/Engine.RendererSettings], in [SystemSettings], in [ConsoleVariables]
; -- the earliest project-owned section there is, applied by
; FConfigCacheIni::LoadConsoleVariablesFromINI during PreInit -- and finally on
; the command line with -dpcvars. All four produce the same two lines:
;
;   LogConfig: CVar [[r.D3D12.PSO.DiskCache:1]] deferred - dummy variable created
;   LogD3D12RHI: Not using pipeline state disk cache per r.D3D12.PSO.DiskCache=0
;
; The RHI reads them while registering them, before any deferred value is
; applied, so there is no route to them from outside the engine. Writing them
; into a section that does not work is worse than leaving them out: it reads
; like a setting somebody chose. See docs/comparisons/packaged/pso/.
