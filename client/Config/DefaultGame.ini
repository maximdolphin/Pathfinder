[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=(A=0,B=0,C=0,D=0)

[/Script/UnrealEd.ProjectPackagingSettings]
; Generated assets are loaded by path at runtime, so nothing in the project
; references them and the cooker does not know they exist. The first packaged
; build came up and reported, for every one of them:
;
;   SkipPackage: /Game/Materials/M_Terrain -- the package to load does not
;   exist on disk or in the loader
;
; which is the packaged build discovering, correctly, that it had no materials
; and no meshes. Naming the directories is how a cooker is told about assets
; that only a string refers to.
+DirectoriesToAlwaysCook=(Path="/Game/Materials")
+DirectoriesToAlwaysCook=(Path="/Game/Meshes")
+DirectoriesToAlwaysCook=(Path="/Game/Surfaces")
+DirectoriesToAlwaysCook=(Path="/Game/Maps")
